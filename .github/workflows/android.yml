
name: Build Vibe Pro Mobile APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Creer la cle Android
        run: |
          mkdir -p "$HOME/.config/.android"
          keytool -genkeypair -v \
            -keystore "$HOME/.config/.android/debug.keystore" \
            -storepass android \
            -alias AndroidDebugKey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000

      - name: Afficher les empreintes de sécurité
        run: gradle :app:signingReport

      - name: Compiler APK
        run: gradle assembleDebug

      - name: Publier APK
        uses: actions/upload-artifact@v4
        with:
          name: Vibe-Pro-Mobile-APK
          path: app/build/outputs/apk/debug/app-debug.apk
